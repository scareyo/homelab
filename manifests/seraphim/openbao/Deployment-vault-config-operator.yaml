apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: vault-config-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vault-config-operator
    app.kubernetes.io/version: v1.0.3
    helm.sh/chart: vault-config-operator-v1.0.3
  name: vault-config-operator
  namespace: openbao
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: vault-config-operator
      app.kubernetes.io/name: vault-config-operator
      control-plane: vault-config-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: vault-config-operator
        app.kubernetes.io/name: vault-config-operator
        control-plane: vault-config-operator
    spec:
      containers:
        - args:
            - --leader-elect
            - --metrics-bind-address=:8443
            - --metrics-secure=true
          command:
            - /manager
          image: quay.io/redhat-cop/vault-config-operator:v1.0.3
          imagePullPolicy: IfNotPresent
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          name: vault-config-operator
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 250Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: webhook-service-cert
              readOnly: true
            - mountPath: /tmp/k8s-metrics-server/serving-certs
              name: metrics-service-cert
              readOnly: true
      securityContext:
        runAsNonRoot: true
      serviceAccountName: vault-config-operator-controller-manager
      volumes:
        - name: webhook-service-cert
          secret:
            defaultMode: 420
            secretName: vault-config-operator-webhook-service-cert
        - name: metrics-service-cert
          secret:
            defaultMode: 420
            secretName: vault-config-operator-metrics-service-cert
