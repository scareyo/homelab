apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  labels:
    app.kubernetes.io/component: vmauth
    app.kubernetes.io/instance: vmks
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vmks
    app.kubernetes.io/version: v1.156.0
    helm.sh/chart: victoria-metrics-k8s-stack-0.98.1
  name: vmks-internal
  namespace: monitoring
spec:
  port: "8427"
  unauthorizedUserAccessSpec:
    targetRefs:
      - crd:
          kind: VLSingle
          name: vmks
          namespace: monitoring
        paths:
          - /select/logsql/.*
      - crd:
          kind: VMSingle
          name: vmks
          namespace: monitoring
        paths:
          - /.*
