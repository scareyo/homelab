apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/instance: vmks
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 13.2.3
    helm.sh/chart: grafana-13.2.7
  name: vmks-grafana-clusterrolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vmks-grafana-clusterrole
subjects:
  - kind: ServiceAccount
    name: vmks-grafana
    namespace: monitoring
