apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  labels:
    app.kubernetes.io/component: vmalert
    app.kubernetes.io/instance: vmks
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vmks
    app.kubernetes.io/version: v1.153.0
    helm.sh/chart: victoria-metrics-k8s-stack-0.95.0
  name: vmks
  namespace: monitoring
spec:
  configMaps: []
  datasource:
    url: http://vmauth-vmks-internal.monitoring.svc.cluster.local.:8427
  evaluationInterval: 20s
  externalLabels: {}
  extraArgs:
    external.alert.source: explore?left={"datasource":"VictoriaMetrics","queries":[{"expr":{{ .Expr|jsonEscape|queryEscape }},"refId":"A"}],"range":{"from":"{{ .ActiveAt.UnixMilli }}","to":"now"}}
    external.url: http://
    http.pathPrefix: /
    remoteWrite.disablePathAppend: "true"
  image:
    tag: v1.153.0
  notifiers:
    - url: http://vmalertmanager-vmks-0.vmalertmanager-vmks.monitoring.svc.cluster.local.:9093
  port: "8080"
  remoteRead:
    url: http://vmsingle-vmks.monitoring.svc.cluster.local.:8428
  remoteWrite:
    url: http://vmsingle-vmks.monitoring.svc.cluster.local.:8428/api/v1/write
  selectAllByDefault: true
