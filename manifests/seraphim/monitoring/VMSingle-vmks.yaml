apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  labels:
    app.kubernetes.io/component: vmsingle
    app.kubernetes.io/instance: vmks
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vmks
    app.kubernetes.io/version: v1.153.0
    helm.sh/chart: victoria-metrics-k8s-stack-0.95.0
  name: vmks
  namespace: monitoring
spec:
  extraArgs:
    vmalert.proxyURL: http://vmalert-vmks.monitoring.svc.cluster.local.:8080
  image:
    tag: v1.153.0
  port: "8428"
  replicaCount: 1
  retentionPeriod: "1"
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
