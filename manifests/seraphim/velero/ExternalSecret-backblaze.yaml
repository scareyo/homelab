apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backblaze
  namespace: velero
spec:
  data:
    - remoteRef:
        key: velero
        property: backblaze-application-key
      secretKey: application_key
    - remoteRef:
        key: velero
        property: backblaze-key-id
      secretKey: key_id
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    template:
      data:
        api-key: |
          [default]
          aws_access_key_id={{ .key_id }}
          aws_secret_access_key={{ .application_key }}
      engineVersion: v2
