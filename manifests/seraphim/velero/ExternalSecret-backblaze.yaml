apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backblaze
  namespace: velero
spec:
  data:
    - remoteRef:
        key: /velero/BACKBLAZE_APPLICATION_KEY
      secretKey: application_key
    - remoteRef:
        key: /velero/BACKBLAZE_KEY_ID
      secretKey: key_id
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    template:
      data:
        api-key: |
          [default]
          aws_access_key_id={{ .key_id }}
          aws_secret_access_key={{ .application_key }}
      engineVersion: v2
