apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage
  namespace: velero
spec:
  data:
    - remoteRef:
        key: /velero/GARAGE_APPLICATION_KEY
      secretKey: application_key
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
    - remoteRef:
        key: /velero/GARAGE_KEY_ID
      secretKey: key_id
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
  target:
    template:
      data:
        api-key: |
          [default]
          aws_access_key_id={{ .key_id }}
          aws_secret_access_key={{ .application_key }}
      engineVersion: v2
