apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations: {}
  labels:
    app: webservice
    chart: webservice-10.5.1
    heritage: Helm
    release: gitlab
  name: gitlab-gitlab
  namespace: gitlab
spec:
  hostnames:
    - gitlab.vegapunk.cloud
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: gateway
  rules:
    - backendRefs:
        - kind: Service
          name: gitlab-webservice-default
          port: 8181
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
      name: default-root
      timeouts:
        backendRequest: 0s
        request: 0s
