apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: gitlab-packages
  namespace: gitlab
spec:
  data:
    - match:
        remoteRef:
          remoteKey: /gitlab/PACKAGES_BUCKET
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: infisical
  selector:
    secret:
      name: gitlab-packages
