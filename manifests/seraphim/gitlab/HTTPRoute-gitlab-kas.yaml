apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations: {}
  labels:
    app: kas
    chart: kas-10.5.1
    heritage: Helm
    release: gitlab
  name: gitlab-kas
  namespace: gitlab
spec:
  hostnames:
    - kas.vegapunk.cloud
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: gateway
  rules:
    - backendRefs:
        - kind: Service
          name: gitlab-kas
          port: 8150
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 0s
