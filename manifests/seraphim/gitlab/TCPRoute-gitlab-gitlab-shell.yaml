apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  annotations: {}
  labels:
    app: gitlab-shell
    chart: gitlab-shell-10.5.1
    heritage: Helm
    release: gitlab
  name: gitlab-gitlab-shell
  namespace: gitlab
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
      namespace: gateway
      sectionName: gitlab-ssh
  rules:
    - backendRefs:
        - name: gitlab-gitlab-shell
          port: 22
