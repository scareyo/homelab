apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: gitlab-redis
  namespace: gitlab
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.4.11
  podSecurityContext:
    fsGroup: 1000
    runAsUser: 1000
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 8Gi
