apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: boxmon
    app.kubernetes.io/name: boxmon
    app.kubernetes.io/part-of: media
    app.kubernetes.io/version: de3c860
  name: boxmon
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: boxmon
      app.kubernetes.io/name: boxmon
  template:
    metadata:
      labels:
        app.kubernetes.io/component: main
        app.kubernetes.io/instance: boxmon
        app.kubernetes.io/name: boxmon
        app.kubernetes.io/part-of: media
        app.kubernetes.io/version: de3c860
    spec:
      containers:
        - env:
            - name: CATEGORIES
              value: radarr,sonarr
            - name: DOWNLOAD_DIR
              value: /media/downloads
            - name: LANG
              value: C.UTF-8
            - name: PHX_HOST
              value: boxmon.vegapunk.cloud
            - name: PHX_PORT
              value: "443"
            - name: PHX_SERVER
              value: "true"
            - name: RELEASE_DISTRIBUTION
              value: none
            - name: REMOTE_ROOT
              value: ~/downloads
          envFrom:
            - secretRef:
                name: boxmon
          image: scarey.dev/scarey/boxmon:de3c860
          name: boxmon
          ports:
            - containerPort: 4000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /media
              name: media
      initContainers:
        - command:
            - mkdir
            - -p
            - /media/downloads
            - /media/shows
            - /media/movies
          env: []
          image: docker.io/library/busybox:1.38.0
          name: init-directories
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /media
              name: media
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
