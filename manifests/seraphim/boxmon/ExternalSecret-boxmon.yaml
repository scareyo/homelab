apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boxmon
  namespace: media
spec:
  data:
    - remoteRef:
        key: /boxmon/HTTP_PASS
      secretKey: HTTP_PASS
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
    - remoteRef:
        key: /boxmon/HTTP_URL
      secretKey: HTTP_URL
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
    - remoteRef:
        key: /boxmon/HTTP_USER
      secretKey: HTTP_USER
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
    - remoteRef:
        key: /boxmon/QBIT_API_KEY
      secretKey: QBIT_API_KEY
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
    - remoteRef:
        key: /boxmon/QBIT_URL
      secretKey: QBIT_URL
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
    - remoteRef:
        key: /boxmon/REMOTE_ROOT
      secretKey: REMOTE_ROOT
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: RELEASE_COOKIE
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: boxmon-release-cookie
    - rewrite:
        - regexp:
            source: password
            target: SECRET_KEY_BASE
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: boxmon-secret-key-base
  refreshPolicy: CreatedOnce
  target: {}
