apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boxmon
  namespace: media
spec:
  data:
    - remoteRef:
        key: /boxmon/HTTP_PASS
      secretKey: HTTP_PASS
    - remoteRef:
        key: /boxmon/HTTP_URL
      secretKey: HTTP_URL
    - remoteRef:
        key: /boxmon/HTTP_USER
      secretKey: HTTP_USER
    - remoteRef:
        key: /boxmon/QBIT_API_KEY
      secretKey: QBIT_API_KEY
    - remoteRef:
        key: /boxmon/QBIT_URL
      secretKey: QBIT_URL
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: RELEASE_COOKIE
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: boxmon-release-cookie
    - rewrite:
        - regexp:
            source: password
            target: SECRET_KEY_BASE
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: boxmon-secret-key-base
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target: {}
