apiVersion: csi.ceph.io/v1
kind: OperatorConfig
metadata:
  name: ceph-csi-operator-config
  namespace: null
spec:
  driverSpecDefaults:
    attachRequired: true
    cephFsClientType: kernel
    controllerPlugin:
      hostNetwork: false
      imagePullPolicy: IfNotPresent
      privileged: false
      replicas: 1
      tolerations: []
      volumes: []
    deployCsiAddons: false
    enableFencing: false
    fsGroupPolicy: File
    fuseMountOptions: {}
    generateOMapInfo: false
    grpcTimeout: 30
    kernelMountOptions: {}
    log:
      rotation:
        maxFiles: 7
        maxLogSize: 10G
        periodicity: daily
      verbosity: 0
    nodePlugin:
      imagePullPolicy: IfNotPresent
      kubeletDirPath: /var/lib/kubelet
      tolerations: []
      volumes: []
    snapshotPolicy: none
