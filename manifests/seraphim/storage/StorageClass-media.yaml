allowedTopologies:
  - matchLabelExpressions:
      - key: kubernetes.io/hostname
        values:
          - s-flamingo
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: media
parameters:
  compression: "off"
  dedup: "off"
  fstype: zfs
  poolname: s-flamingo
  recordsize: 128k
  shared: "yes"
provisioner: zfs.csi.openebs.io
reclaimPolicy: Retain
