apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage
  namespace: garage
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: rpcSecret
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: garage-rpcsecret
  refreshPolicy: CreatedOnce
  target: {}
