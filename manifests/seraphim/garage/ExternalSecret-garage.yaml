apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage
  namespace: garage
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: adminToken
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: garage-admintoken
    - rewrite:
        - regexp:
            source: password
            target: rpcSecret
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: garage-rpcsecret
  refreshPolicy: CreatedOnce
  target:
    template:
      data:
        adminToken: '{{ .adminToken }}'
        jwtSecret: '{{ genPrivateKey "ed25519" }}'
        rpcSecret: '{{ .rpcSecret }}'
      engineVersion: v2
