apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/instance: garage
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: garage
    app.kubernetes.io/version: v2.5.0
    helm.sh/chart: garage-0.10.4
  name: garage
  namespace: garage
spec:
  podManagementPolicy: OrderedReady
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: garage
      app.kubernetes.io/name: garage
  serviceName: garage-headless
  template:
    metadata:
      annotations:
        checksum/config: d8e79d9063821029f8c15d9653c26613788d8046bb06ca0bd82f695f3a7aafc4
      labels:
        app.kubernetes.io/instance: garage
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: garage
        app.kubernetes.io/version: v2.5.0
        helm.sh/chart: garage-0.10.4
    spec:
      containers:
        - args:
            - server
            - --single-node
          command:
            - /garage
          image: dxflrs/amd64_garage:v2.5.0
          imagePullPolicy: IfNotPresent
          name: garage
          ports:
            - containerPort: 3900
              name: s3-api
            - containerPort: 3902
              name: web-api
            - containerPort: 3903
              name: admin
          resources: {}
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /mnt/meta
              name: meta
            - mountPath: /mnt/data
              name: data
            - mountPath: /etc/garage.toml
              name: etc
              subPath: garage.toml
      initContainers:
        - command:
            - sh
            - -c
            - sed "s/__RPC_SECRET_REPLACE__/$RPC_SECRET/" /mnt/garage.toml > /mnt/etc/garage.toml
          env:
            - name: RPC_SECRET
              valueFrom:
                secretKeyRef:
                  key: rpcSecret
                  name: garage
          image: busybox:stable
          imagePullPolicy: IfNotPresent
          name: garage-init
          securityContext:
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /mnt/garage.toml
              name: configmap
              subPath: garage.toml
            - mountPath: /mnt/etc
              name: etc
      nodeSelector:
        kubernetes.io/hostname: s-flamingo
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: garage
      volumes:
        - configMap:
            name: garage-config
          name: configmap
        - emptyDir: {}
          name: etc
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        storageClassName: ceph-block
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Ti
        storageClassName: openebs-zfs-dataset
