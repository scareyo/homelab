apiVersion: v1
data:
  oauth2_proxy.cfg: |
    upstreams="http://changedetection.changedetection.svc.cluster.local:80"
    email_domains="*"
    redirect_url="https://changedetection.vegapunk.cloud/oauth2/callback"
    provider="oidc"
    scope="openid email profile groups"
    provider_display_name="Pocket ID"
    custom_sign_in_logo="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/changedetection.webp"
    banner="changedetection.io"
    insecure_oidc_allow_unverified_email="true"
kind: ConfigMap
metadata:
  name: changedetection-oauth2-proxy
  namespace: changedetection
