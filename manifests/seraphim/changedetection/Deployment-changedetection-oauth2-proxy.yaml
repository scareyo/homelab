apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: authentication-proxy
    app.kubernetes.io/instance: oauth2-proxy-changedetection
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: changedetection
    app.kubernetes.io/version: v7.15.5
  name: changedetection-oauth2-proxy
  namespace: changedetection
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: oauth2-proxy-changedetection
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      annotations:
        checksum/config: 6921dcdd73890c18e37321ff60167b9723720f9e80c0370ee8ccedbfd5930365
      labels:
        app.kubernetes.io/component: authentication-proxy
        app.kubernetes.io/instance: oauth2-proxy-changedetection
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/part-of: changedetection
        app.kubernetes.io/version: v7.15.5
    spec:
      containers:
        - args:
            - --http-address=0.0.0.0:8080
            - --metrics-address=0.0.0.0:8081
            - --config=/etc/oauth2_proxy/oauth2_proxy.cfg
          envFrom:
            - secretRef:
                name: changedetection-oauth2-proxy
            - secretRef:
                name: changedetection-oauth2-proxy-oidc-credentials
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          name: oauth2-proxy
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/oauth2_proxy
              name: config
      securityContext:
        runAsGroup: 1000
        runAsUser: 1000
      volumes:
        - configMap:
            name: changedetection-oauth2-proxy
          name: config
