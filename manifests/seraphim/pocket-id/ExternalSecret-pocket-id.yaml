apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  data:
    - remoteRef:
        key: pocket-id
        property: encryption-key
      secretKey: encryption-key
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target: {}
