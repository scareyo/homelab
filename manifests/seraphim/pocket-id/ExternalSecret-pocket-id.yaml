apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id
  namespace: pocket-id
spec:
  data:
    - remoteRef:
        key: /pocket-id/ENCRYPTION_KEY
      secretKey: encryption-key
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
  target: {}
