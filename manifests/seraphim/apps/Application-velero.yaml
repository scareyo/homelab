apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  destination:
    namespace: velero
    server: https://kubernetes.default.svc
  project: system
  source:
    path: ./manifests/seraphim/velero
    repoURL: https://github.com/scareyo/homelab
    targetRevision: main
  syncPolicy: {}
