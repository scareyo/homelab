apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recyclarr
  namespace: argocd
spec:
  destination:
    namespace: media
    server: https://kubernetes.default.svc
  project: media
  source:
    path: ./manifests/seraphim/recyclarr
    repoURL: https://github.com/scareyo/homelab
    targetRevision: main
  syncPolicy: {}
