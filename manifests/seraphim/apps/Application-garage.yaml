apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage
  namespace: argocd
spec:
  destination:
    namespace: garage
    server: https://kubernetes.default.svc
  project: system
  source:
    path: ./manifests/seraphim/garage
    repoURL: https://github.com/scareyo/homelab
    targetRevision: main
  syncPolicy: {}
