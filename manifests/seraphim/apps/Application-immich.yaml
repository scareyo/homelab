apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  destination:
    namespace: immich
    server: https://kubernetes.default.svc
  project: media
  source:
    path: ./manifests/seraphim/immich
    repoURL: https://github.com/scareyo/homelab
    targetRevision: main
  syncPolicy: {}
