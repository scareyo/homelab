apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: system
  source:
    path: ./manifests/seraphim/argocd
    repoURL: https://github.com/scareyo/homelab
    targetRevision: main
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
