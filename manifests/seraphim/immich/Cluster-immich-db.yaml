apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  namespace: immich
spec:
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.6
  instances: 3
  monitoring:
    enablePodMonitor: true
  postgresql:
    shared_preload_libraries:
      - vchord.so
  storage:
    size: 8Gi
