apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich
  namespace: immich
spec:
  data:
    - remoteRef:
        key: immich-oidc-credentials
        property: client_id
      secretKey: client_id
      sourceRef:
        storeRef:
          kind: SecretStore
          name: external-secrets-kubernetes
    - remoteRef:
        key: immich-oidc-credentials
        property: client_secret
      secretKey: client_secret
      sourceRef:
        storeRef:
          kind: SecretStore
          name: external-secrets-kubernetes
  target:
    template:
      data:
        immich-config.yaml: |
          oauth:
            enabled: true
            clientId: "{{ .client_id }}"
            clientSecret: "{{ .client_secret }}"
            issuerUrl: "https://id.vegapunk.cloud"
          passwordLogin:
            enabled: false
      engineVersion: v2
