apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: external-secrets-kubernetes
  namespace: immich
spec:
  provider:
    kubernetes:
      auth:
        serviceAccount:
          name: external-secrets-kubernetes
      remoteNamespace: immich
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          type: ConfigMap
