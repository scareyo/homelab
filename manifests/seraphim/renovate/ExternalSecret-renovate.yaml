apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate
  namespace: renovate
spec:
  data:
    - remoteRef:
        key: /renovate/GITHUB_TOKEN
      secretKey: RENOVATE_GITHUB_COM_TOKEN
    - remoteRef:
        key: /renovate/FORGEJO_TOKEN
      secretKey: RENOVATE_TOKEN
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target: {}
