apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate
  namespace: renovate
spec:
  data:
    - remoteRef:
        key: /renovate/GITHUB_TOKEN
      secretKey: RENOVATE_GITHUB_COM_TOKEN
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
    - remoteRef:
        key: /renovate/FORGEJO_TOKEN
      secretKey: RENOVATE_TOKEN
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
  target: {}
