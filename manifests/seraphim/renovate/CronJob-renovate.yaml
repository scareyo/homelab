apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/instance: renovate
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: renovate
    app.kubernetes.io/version: 44.155.9
    helm.sh/chart: renovate-46.357.9
  name: renovate
  namespace: renovate
spec:
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/instance: renovate
        app.kubernetes.io/name: renovate
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: renovate
            app.kubernetes.io/name: renovate
        spec:
          containers:
            - env:
                - name: RENOVATE_CONFIG_FILE
                  value: /usr/src/app/config.json
              envFrom:
                - secretRef:
                    name: renovate
              image: scarey.dev/scarey/renovate:44.104.0
              imagePullPolicy: IfNotPresent
              name: renovate
              volumeMounts:
                - mountPath: /usr/src/app/config.json
                  name: config-volume
                  subPath: config.json
          restartPolicy: Never
          serviceAccountName: default
          volumes:
            - configMap:
                name: renovate-config
              name: config-volume
  schedule: 0 1 * * *
