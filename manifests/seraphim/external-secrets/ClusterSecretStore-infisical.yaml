apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      auth:
        universalAuthCredentials:
          clientId:
            key: client-id
            name: infisical
            namespace: external-secrets
          clientSecret:
            key: client-secret
            name: infisical
            namespace: external-secrets
      secretsScope:
        environmentSlug: prod
        projectSlug: homelab
