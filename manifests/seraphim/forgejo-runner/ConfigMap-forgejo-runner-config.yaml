apiVersion: v1
data:
  podspec-default.yaml: |-
    containers:
      - name: main
        image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04
        imagePullPolicy: IfNotPresent
        env:
          - name: DEBIAN_FRONTEND
            value: noninteractive
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            cpu: 500m
            memory: 4Gi
    restartPolicy: Never
  runner.yaml: |-
    cache:
      enabled: true
      dir: /data/cache
      port: 8088
      proxy_port: 8089
    container:
      docker_host: "-"
      workdir_parent: shared/workdir
    host:
      workdir_parent: /data/act
    log:
      level: info
    plugins:
      k8s:
        address: "unix:///plugin/forgejo-runner-k8s.sock"
        options:
          namespace: forgejo-runner
          poll_timeout: 10m
          labels: "app.kubernetes.io/name=forgejo-runner-instance"
          resources: |
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
    runner:
      capacity: 3
      labels:
        - ubuntu-latest:k8s:///config/podspec-default.yaml
        - default:k8s:///config/podspec-default.yaml
      timeout: 3h
      shutdown_timeout: 3m
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: forgejo-runner
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/version: 13.2.1
    helm.sh/chart: forgejo-runner-13.2.1
  name: forgejo-runner-config
  namespace: forgejo-runner
