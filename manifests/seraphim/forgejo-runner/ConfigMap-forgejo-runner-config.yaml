apiVersion: v1
data:
  podspec-nix.yaml: |-
    initContainers:
      - name: attic-use
        image: scarey.dev/scarey/forgejo-runner:419fe0f
        imagePullPolicy: IfNotPresent
        command: [ "attic", "use", "forgejo-runner" ]
        volumeMounts:
          - name: attic
            mountPath: /run/secrets/attic
            readOnly: true
          - name: nix-config
            mountPath: /home/user/.config/nix
    containers:
      - name: main
        image: scarey.dev/scarey/forgejo-runner:419fe0f
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 1
            memory: 2Gi
          limits:
            cpu: 4
            memory: 8Gi
        volumeMounts:
          - name: attic
            mountPath: /run/secrets/attic
            readOnly: true
          - name: nix-config
            mountPath: /home/user/.config/nix
    volumes:
      - name: attic
        secret:
          secretName: attic
      - name: nix-config
        emptyDir: {}
    restartPolicy: Never
  runner.yaml: |-
    cache:
      enabled: true
      dir: /data/cache
      port: 8088
      proxy_port: 8089
    container:
      docker_host: "-"
      workdir_parent: shared/workdir
    host:
      workdir_parent: /data/act
    log:
      level: info
    plugins:
      k8s:
        address: "unix:///plugin/forgejo-runner-k8s.sock"
        options:
          namespace: forgejo-runner
          poll_timeout: 10m
          labels: "app.kubernetes.io/name=forgejo-runner-instance"
          resources: |
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
    runner:
      capacity: 3
      labels:
        - default:k8s:///config/podspec-nix.yaml
        - nix:k8s:///config/podspec-nix.yaml
      timeout: 3h
      shutdown_timeout: 3m
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: forgejo-runner
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/version: 13.2.1
    helm.sh/chart: forgejo-runner-13.2.1
  name: forgejo-runner-config
  namespace: forgejo-runner
