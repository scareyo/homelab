apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
spec:
  data:
    - remoteRef:
        key: /forgejo-runner/RUNNER_TOKEN
      secretKey: token
    - remoteRef:
        key: /forgejo-runner/RUNNER_UUID
      secretKey: uuid
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target: {}
