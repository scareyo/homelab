apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
  namespace: forgejo-runner
spec:
  data:
    - remoteRef:
        key: /forgejo-runner/RUNNER_TOKEN
      secretKey: token
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
    - remoteRef:
        key: /forgejo-runner/RUNNER_UUID
      secretKey: uuid
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
  target: {}
