apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/instance: forgejo-runner
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/version: 13.2.1
    helm.sh/chart: forgejo-runner-13.2.1
  name: forgejo-runner
  namespace: forgejo-runner
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
      - get
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
      - list
      - watch
