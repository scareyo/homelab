apiVersion: v1
data:
  theme-scarey.css: |
    @import "./theme-forgejo-dark.css";

    :root {
      /* deep ink-blue neutrals */
      --steel-900: #0b0e14;
      --steel-850: #0e121a;
      --steel-800: #121722;
      --steel-750: #171d2a;
      --steel-700: #1c2333;
      --steel-650: #232b3d;
      --steel-600: #2c3549;
      --steel-550: #374156;
      --steel-500: #444f66;
      --steel-450: #525e77;
      --steel-400: #626e88;
      --steel-350: #737f99;
      --steel-300: #8591aa;
      --steel-250: #98a3bb;
      --steel-200: #abb5cb;
      --steel-150: #bfc8db;
      --steel-100: #d5dcea;

      /* electric blue accent */
      --color-primary: #3b82f6;
      --color-primary-contrast: #fff;
      --color-primary-dark-1: #60a5fa;
      --color-primary-dark-2: #60a5fa;
      --color-primary-dark-3: #93c5fd;
      --color-primary-dark-4: #bfdbfe;
      --color-primary-light-1: #2563eb;
      --color-primary-light-2: #1d4ed8;
      --color-primary-light-3: #1d4ed8;
      --color-primary-light-4: #1e40af;
      --color-primary-light-5: #1e40af;
      --color-primary-light-6: #1e3a8a;
      --color-primary-light-7: #1e3a8a;
      --color-primary-alpha-10: #3b82f619;
      --color-primary-alpha-20: #3b82f633;
      --color-primary-alpha-30: #3b82f64b;
      --color-primary-alpha-40: #3b82f666;
      --color-primary-alpha-50: #3b82f680;
      --color-primary-alpha-60: #3b82f699;
      --color-primary-alpha-70: #3b82f6b3;
      --color-primary-alpha-80: #3b82f6cc;
      --color-primary-alpha-90: #3b82f6e1;

      --color-info-border: #2563eb;
      --color-info-bg: #172554;
      --color-selection-bg: #3b82f6;
      --color-selection-fg: #fff;

      --border-radius: 8px;
      --border-radius-medium: 10px;
    }

    .ui.primary.button,
    .ui.primary.buttons .button {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
    }
    img[src$="/img/logo.svg"] {
      filter: hue-rotate(195deg) saturate(1.2);
    }
    .ui.primary.button:hover,
    .ui.primary.buttons .button:hover {
      filter: brightness(1.12);
    }
kind: ConfigMap
metadata:
  name: forgejo-theme
  namespace: forgejo
