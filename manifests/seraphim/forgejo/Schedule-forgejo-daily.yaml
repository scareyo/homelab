apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: forgejo-daily
  namespace: velero
spec:
  schedule: 0 6 * * *
  template:
    includedNamespaces:
      - forgejo
    includedResources:
      - pv
      - pvc
    snapshotMoveData: true
    snapshotVolumes: true
    storageLocation: default
    ttl: 360h
