apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin
  namespace: forgejo
spec:
  data:
    - remoteRef:
        key: forgejo
        property: password
      secretKey: password
    - remoteRef:
        key: forgejo
        property: username
      secretKey: username
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target: {}
