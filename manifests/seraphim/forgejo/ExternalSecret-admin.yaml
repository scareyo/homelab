apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin
  namespace: forgejo
spec:
  data:
    - remoteRef:
        key: /forgejo/ADMIN_PASSWORD
      secretKey: password
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
    - remoteRef:
        key: /forgejo/ADMIN_USERNAME
      secretKey: username
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: infisical
  target: {}
