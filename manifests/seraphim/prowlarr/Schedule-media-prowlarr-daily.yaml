apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: media-prowlarr-daily
  namespace: velero
spec:
  schedule: 0 6 * * *
  template:
    includedNamespaces:
      - media
    includedResources:
      - pv
      - pvc
    labelSelector:
      matchLabels:
        app.kubernetes.io/instance: prowlarr
    snapshotMoveData: true
    snapshotVolumes: true
    storageLocation: default
    ttl: 360h
