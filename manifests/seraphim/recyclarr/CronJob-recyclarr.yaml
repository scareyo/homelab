apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: recyclarr
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: media
    app.kubernetes.io/version: 8.8.0
  name: recyclarr
  namespace: media
spec:
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: main
            app.kubernetes.io/instance: recyclarr
            app.kubernetes.io/name: recyclarr
            app.kubernetes.io/part-of: media
            app.kubernetes.io/version: 8.8.0
        spec:
          containers:
            - args:
                - sync
                - --config
                - /cfg/recyclarr.yaml
              env: []
              envFrom:
                - secretRef:
                    name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.8.0
              name: recyclarr
              ports: []
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - mountPath: /cfg
                  name: config
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsUser: 1000
          volumes:
            - configMap:
                name: recyclarr-config
              name: config
  schedule: 0 0 * * *
