apiVersion: v1
data:
  recyclarr.yaml: |
    radarr:
      movies:
        base_url: http://radarr
        api_key: !env_var RADARR_API_KEY

        media_naming:
          movie:
            rename: true
            standard: standard

        delete_old_custom_formats: true

        quality_definition:
          type: movie

        quality_profiles:
          - trash_id: d1d310673359205736b4b84acd5ea8c8  # Remux 2160p (Combined)
            name: Default
            reset_unmatched_scores:
              enabled: true
          - trash_id: 722b624f9af1e492284c4bc842153a38  # [Anime] Remux-1080p
            name: Anime
            reset_unmatched_scores:
              enabled: true

        custom_format_groups:
          add:
            - trash_id: ff204bbcecdd487d1cefcefdbf0c278d  # [Optional] Golden Rule UHD
              exclude:
                - 839bea857ed2c0a8e084f3cbdbd65ecb  # x265 (no HDR/DV)
            - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76  # [HDR Formats] DV (w/o HDR fallback)
            - trash_id: 1616617ab3a14397a2b2321bcbda44d1  # [HDR Formats] DV Boost
            - trash_id: b29413a7487478fe98228ce79e5689e4  # [HDR Formats] HDR10+ Boost
            - trash_id: f993ad37540147e4d00e66503545d81b  # [Streaming Services] Anime
            - trash_id: f4f1474b963b24cf983455743aa9906c  # [Optional] Movie Versions
              select:
                - eca37840c13c6ef2dd0262b141a5482f  # 4K Remaster
                - eecf3a857724171f968a66cb5719e152  # IMAX
                - 9f6cbff8cfe4ebbc1bde14c7b7bec0de  # IMAX Enhanced

    sonarr:
      shows:
        base_url: http://sonarr
        api_key: !env_var SONARR_API_KEY

        media_naming:
          series: jellyfin-tvdb
          season: default
          episodes:
            rename: true
            standard: default
            daily: default
            anime: default

        delete_old_custom_formats: true

        quality_definition:
          type: series

        quality_profiles:
          - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
            name: Default
            reset_unmatched_scores:
              enabled: true
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
            name: Anime
            reset_unmatched_scores:
              enabled: true

        custom_format_groups:
          add:
            - trash_id: e3f37512790f00d0e89e54fe5e790d1c  # [Optional] Golden Rule UHD
              exclude:
                - 9b64dff695c2115facf1b6ea59c9bd07  # x265 (no HDR/DV)
            - trash_id: d776a1ea912a117d66d83b880ff2055d  # [HDR Formats] DV (w/o HDR fallback)
            - trash_id: e0b2774083df4265f25c9e5bc6c80940  # [HDR Formats] DV Boost
            - trash_id: 7d366c213e5c23a052b157356fac1921  # [HDR Formats] HDR10+ Boost
            - trash_id: d920fd959d220306888f40b6f38e1578  # [Optional] Season Packs
            - trash_id: f54985e5e96747cef58731f1cf4c9181  # [Streaming Services] Anime
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: recyclarr
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: media
    app.kubernetes.io/version: 8.8.0
  name: recyclarr-config
  namespace: media
