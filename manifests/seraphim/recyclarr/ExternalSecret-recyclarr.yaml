apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr
  namespace: media
spec:
  data:
    - remoteRef:
        key: /recyclarr/RADARR_API_KEY
      secretKey: RADARR_API_KEY
    - remoteRef:
        key: /recyclarr/SONARR_API_KEY
      secretKey: SONARR_API_KEY
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target: {}
