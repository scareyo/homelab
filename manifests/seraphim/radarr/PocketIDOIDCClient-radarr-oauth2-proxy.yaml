apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: radarr-oauth2-proxy
  namespace: media
spec:
  allowedUserGroups:
    - name: radarr-user
  callbackUrls:
    - https://radarr.vegapunk.cloud/oauth2/callback
  description: Monitor movies
  launchUrl: https://radarr.vegapunk.cloud
  logo:
    nameOverride: radarr
  name: Radarr
  secret:
    keys:
      clientID: OAUTH2_PROXY_CLIENT_ID
      clientSecret: OAUTH2_PROXY_CLIENT_SECRET
      issuerUrl: OAUTH2_PROXY_OIDC_ISSUER_URL
