apiVersion: v1
data:
  oauth2_proxy.cfg: |
    upstreams="http://sonarr.media.svc.cluster.local:80"
    email_domains="*"
    redirect_url="https://sonarr.vegapunk.cloud/oauth2/callback"
    provider="oidc"
    scope="openid email profile groups"
    provider_display_name="Pocket ID"
    custom_sign_in_logo="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/sonarr.webp"
    banner="Sonarr"
    insecure_oidc_allow_unverified_email="true"
kind: ConfigMap
metadata:
  name: sonarr-oauth2-proxy
  namespace: media
