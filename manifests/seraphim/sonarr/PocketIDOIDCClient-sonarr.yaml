apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: sonarr
  namespace: media
spec:
  allowedUserGroups:
    - name: sonarr-user
  callbackUrls:
    - https://sonarr.vegapunk.cloud/oauth2/callback
  description: Monitor TV shows
  launchUrl: https://sonarr.vegapunk.cloud
  name: Sonarr
  secret:
    keys:
      clientID: OAUTH2_PROXY_CLIENT_ID
      clientSecret: OAUTH2_PROXY_CLIENT_SECRET
      issuerUrl: OAUTH2_PROXY_OIDC_ISSUER_URL
