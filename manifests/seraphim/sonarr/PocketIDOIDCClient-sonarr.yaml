apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: sonarr
  namespace: media
spec:
  callbackUrls:
    - https://sonarr.vegapunk.cloud/signin-oidc
  description: Monitor TV shows
  launchUrl: https://sonarr.vegapunk.cloud
  logoutCallbackUrls:
    - https://sonarr.vegapunk.cloud/signout-callback-oidc
  name: Sonarr
  secret:
    keys:
      clientID: SONARR__AUTH__OIDCCLIENTID
      clientSecret: SONARR__AUTH__OIDCCLIENTSECRET
      issuerUrl: SONARR__AUTH__OIDCAUTHORITY
