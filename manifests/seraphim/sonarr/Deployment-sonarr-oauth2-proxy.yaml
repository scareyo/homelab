apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: authentication-proxy
    app.kubernetes.io/instance: oauth2-proxy-sonarr
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/part-of: media
    app.kubernetes.io/version: v7.15.5
  name: sonarr-oauth2-proxy
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: oauth2-proxy-sonarr
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      annotations:
        checksum/config: 5f17d47a7dff47f511f60a68754a5958385c2034227a16705c6ec6b6d176c63d
      labels:
        app.kubernetes.io/component: authentication-proxy
        app.kubernetes.io/instance: oauth2-proxy-sonarr
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/part-of: media
        app.kubernetes.io/version: v7.15.5
    spec:
      containers:
        - args:
            - --http-address=0.0.0.0:8080
            - --metrics-address=0.0.0.0:8081
            - --config=/etc/oauth2_proxy/oauth2_proxy.cfg
          envFrom:
            - secretRef:
                name: sonarr-oauth2-proxy
            - secretRef:
                name: sonarr-oauth2-proxy-oidc-credentials
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          name: oauth2-proxy
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/oauth2_proxy
              name: config
      securityContext:
        runAsGroup: 1000
        runAsUser: 1000
      volumes:
        - configMap:
            name: sonarr-oauth2-proxy
          name: config
