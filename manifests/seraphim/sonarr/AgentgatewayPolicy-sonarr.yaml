apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: sonarr
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: sonarr
  traffic:
    transformation:
      request:
        set:
          - name: x-forwarded-proto
            value: request.scheme
