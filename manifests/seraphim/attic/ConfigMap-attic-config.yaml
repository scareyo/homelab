apiVersion: v1
data:
  server.toml: |
    listen = "[::]:8080"
    allowed-hosts = ["attic.scarey.dev"]
    api-endpoint = "https://attic.scarey.dev/"

    [database]

    [storage]
    type = "s3"
    region = ""
    bucket = "attic"
    endpoint = "http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc"

    [chunking]
    nar-size-threshold = 65536  # chunk files that are 64 KiB or larger
    min-size = 16384            # 16 KiB
    avg-size = 65536            # 64 KiB
    max-size = 262144           # 256 KiB

    [compression]
    type = "zstd"

    [garbage-collection]
    interval = "12 hours"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: attic
    app.kubernetes.io/name: attic
    app.kubernetes.io/part-of: attic
    app.kubernetes.io/version: 0-unstable-2026-07-06
  name: attic-config
  namespace: attic
