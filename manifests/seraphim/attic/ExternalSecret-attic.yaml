apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: attic
  namespace: attic
spec:
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: secret
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: attic-secret
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    template:
      data:
        ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64: '{{ .secret | b64enc }}'
      engineVersion: v2
