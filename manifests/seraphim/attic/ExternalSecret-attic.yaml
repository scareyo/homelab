apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: attic
  namespace: attic
spec:
  data:
    - remoteRef:
        key: attic-obc
        property: AWS_ACCESS_KEY_ID
      secretKey: aws-access-key-id
      sourceRef:
        storeRef:
          kind: SecretStore
          name: external-secrets-kubernetes
    - remoteRef:
        key: attic-obc
        property: AWS_SECRET_ACCESS_KEY
      secretKey: aws-secret-access-key
      sourceRef:
        storeRef:
          kind: SecretStore
          name: external-secrets-kubernetes
    - remoteRef:
        key: attic-db-app
        property: uri
      secretKey: database-url
      sourceRef:
        storeRef:
          kind: SecretStore
          name: external-secrets-kubernetes
  dataFrom:
    - rewrite:
        - regexp:
            source: password
            target: token-hs256-secret-base64
      sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: attic-token-hs256-secret-base64
  refreshPolicy: CreatedOnce
  target: {}
