apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "0"
  labels:
    app.kubernetes.io/component: migration
    app.kubernetes.io/instance: attic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: attic
    app.kubernetes.io/part-of: helmforge
    app.kubernetes.io/version: 0.1.0
    helm.sh/chart: attic-1.1.0
  name: attic-migrate
  namespace: attic
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migration
        app.kubernetes.io/instance: attic
        app.kubernetes.io/name: attic
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --mode
            - db-migrations
          env:
            - name: ATTIC_SERVER_CONFIG_BASE64
              value: 
            - name: HOME
              value: /tmp
            - name: RUST_LOG
              value: attic_server=info
            - name: ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64
              valueFrom:
                secretKeyRef:
                  key: token-hs256-secret-base64
                  name: attic
                  optional: true
            - name: ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64
              valueFrom:
                secretKeyRef:
                  key: token-rs256-secret-base64
                  name: attic
                  optional: true
            - name: ATTIC_SERVER_TOKEN_RS256_PUBKEY_BASE64
              valueFrom:
                secretKeyRef:
                  key: token-rs256-pubkey-base64
                  name: attic
                  optional: true
            - name: ATTIC_SERVER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: database-url
                  name: attic
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: aws-access-key-id
                  name: attic
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: aws-secret-access-key
                  name: attic
                  optional: true
          image: ghcr.io/zhaofengli/attic:9eda345a743f50999de04f59a170806c3e029eea
          imagePullPolicy: IfNotPresent
          name: migrate
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - emptyDir: {}
          name: tmp
  ttlSecondsAfterFinished: 300
