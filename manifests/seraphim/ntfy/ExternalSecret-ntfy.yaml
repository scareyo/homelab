apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy
  namespace: ntfy
spec:
  data:
    - remoteRef:
        key: /ntfy/AUTH_TOKENS
      secretKey: NTFY_AUTH_TOKENS
    - remoteRef:
        key: /ntfy/AUTH_USERS
      secretKey: NTFY_AUTH_USERS
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target: {}
