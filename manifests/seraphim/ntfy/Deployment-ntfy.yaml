apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: ntfy
    app.kubernetes.io/name: ntfy
    app.kubernetes.io/part-of: ntfy
    app.kubernetes.io/version: v2.34.0
  name: ntfy
  namespace: ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: ntfy
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/component: main
        app.kubernetes.io/instance: ntfy
        app.kubernetes.io/name: ntfy
        app.kubernetes.io/part-of: ntfy
        app.kubernetes.io/version: v2.34.0
    spec:
      containers:
        - args:
            - serve
          env:
            - name: NTFY_AUTH_DEFAULT_ACCESS
              value: deny-all
            - name: NTFY_AUTH_FILE
              value: /var/lib/ntfy/user.db
            - name: NTFY_BASE_URL
              value: https://ntfy.vegapunk.cloud
            - name: NTFY_BEHIND_PROXY
              value: "true"
            - name: NTFY_CACHE_FILE
              value: /var/lib/ntfy/cache.db
            - name: NTFY_ENABLE_LOGIN
              value: "true"
            - name: NTFY_LISTEN_HTTP
              value: :8080
            - name: NTFY_UPSTREAM_BASE_URL
              value: https://ntfy.sh
          envFrom:
            - secretRef:
                name: ntfy
          image: docker.io/binwiederhier/ntfy:v2.34.0
          name: ntfy
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /var/lib/ntfy
              name: data
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsUser: 1000
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data
