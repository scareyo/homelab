router bgp 65000
 bgp router-id 10.10.20.1

 neighbor seraphim peer-group
 neighbor seraphim remote-as 65001

 bgp listen range 10.10.20.0/24 peer-group seraphim
 bgp listen limit 50

address-family ipv4 unicast
 neighbor seraphim activate
 neighbor seraphim send-community all
 neighbor seraphim soft-reconfiguration inbound
 neighbor seraphim route-map CILIUM_LB in
exit-address-family

ip prefix-list CILIUM_ROUTES seq 5 permit 10.10.21.0/24 le 32

route-map CILIUM_LB permit 10
 match ip address prefix-list CILIUM_ROUTES
