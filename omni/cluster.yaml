---
kind: Cluster
name: seraphim
talos:
  version: v1.14.1
kubernetes:
  version: v1.37.0
  manifests:
    - name: argocd
      file: manifests/argocd.yaml
      mode: one-time
    - name: cilium
      file: manifests/cilium.yaml
      mode: one-time
patches:
  - name: disable-default-cni
    inline:
      apiVersion: v1alpha1
      kind: KubeFlannelCNIConfig
      $patch: delete
---
kind: ControlPlane
machines:
  - b2107c00-66a0-11ef-911b-e24494d5a600
  - 0bfc3d80-65de-11ef-a60b-c244053fa300
  - c9bc1600-6648-11ef-809d-08f808ecb600
patches:
  - name: disable-kube-proxy
    inline:
      apiVersion: v1alpha1
      kind: KubeProxyConfig
      enabled: false
  - name: allow-scheduling
    inline:
      apiVersion: v1alpha1
      kind: KubeNodeConfig
      labels:
        node.kubernetes.io/exclude-from-external-load-balancers:
          $patch: delete
      taints:
        node-role.kubernetes.io/control-plane:
          $patch: delete
---
kind: Workers
